syntax = "proto3";

package nooks.api.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

// ListService covers Lists and the Items on them — the whole of nooks, really.
// Everything else is a view over these.
service ListService {
  // ListLists returns one page of the Lists the signed-in Member can reach, filtered
  // and ordered as asked. What a page holds is the server's own promise about how much
  // work one read is, so a caller asking for more than the ceiling gets the ceiling.
  rpc ListLists(ListListsRequest) returns (ListListsResponse) {
    option (google.api.http) = {get: "/api/v1/lists"};
  }

  // GetSidebar returns the four groups a sidebar draws, each capped and each saying how
  // many there are.
  //
  // Its own call rather than a page of ListLists: a sidebar is four bounded reads with
  // four totals, and asking for that as pages would be four round trips to draw one
  // column.
  rpc GetSidebar(GetSidebarRequest) returns (GetSidebarResponse) {
    option (google.api.http) = {get: "/api/v1/sidebar"};
  }

  // GetList returns one List and its Items, in their manual order.
  rpc GetList(GetListRequest) returns (GetListResponse) {
    option (google.api.http) = {get: "/api/v1/lists/{list_uid}"};
  }

  // GetItem returns one Item, including its Note in full.
  //
  // Its own call rather than a read of the List it sits on: a caller that wants what
  // somebody wrote about one thing should not have to fetch everything on the List to
  // find it, and a reader shown a shortened Note needs somewhere to go for the rest.
  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option (google.api.http) = {get: "/api/v1/items/{item_uid}"};
  }

  // CreateList adds a List. It starts private.
  rpc CreateList(CreateListRequest) returns (CreateListResponse) {
    option (google.api.http) = {
      post: "/api/v1/lists"
      body: "*"
    };
  }

  // RenameList changes a List's name. Only its owner may.
  rpc RenameList(RenameListRequest) returns (RenameListResponse) {
    option (google.api.http) = {
      patch: "/api/v1/lists/{list_uid}"
      body: "*"
    };
  }

  // SetListSharing changes who can reach a List. Only its owner may.
  rpc SetListSharing(SetListSharingRequest) returns (SetListSharingResponse) {
    option (google.api.http) = {
      put: "/api/v1/lists/{list_uid}/sharing"
      body: "*"
    };
  }

  // GetListShares returns who a List reaches by name, for the share dialog.
  rpc GetListShares(GetListSharesRequest) returns (GetListSharesResponse) {
    option (google.api.http) = {get: "/api/v1/lists/{list_uid}/shares"};
  }

  // SetListArchived puts a List out of the sidebar, or brings it back. Only its owner
  // may: archiving a shared List takes it out of everybody's sidebar. Archiving is not
  // deleting — what is archived keeps its Items and can be restored.
  rpc SetListArchived(SetListArchivedRequest) returns (SetListArchivedResponse) {
    option (google.api.http) = {
      post: "/api/v1/lists/{list_uid}/archived"
      body: "*"
    };
  }

  // RestoreList brings back a List its owner deleted, with everything on it findable
  // again. Only its owner may, and only inside the window before it is removed for
  // good.
  rpc RestoreList(RestoreListRequest) returns (RestoreListResponse) {
    option (google.api.http) = {
      post: "/api/v1/lists/{list_uid}:restore"
      body: "*"
    };
  }

  // DeleteList removes a List and the Items on it. Only its owner may.
  rpc DeleteList(DeleteListRequest) returns (DeleteListResponse) {
    option (google.api.http) = {delete: "/api/v1/lists/{list_uid}"};
  }

  // DuplicateList copies a List and the Items still open on it.
  //
  // The copy starts private and starts empty of history: it is a new List that happens
  // to begin with the same things on it, not a second view of the first.
  rpc DuplicateList(DuplicateListRequest) returns (DuplicateListResponse) {
    option (google.api.http) = {
      post: "/api/v1/lists/{list_uid}:duplicate"
      body: "*"
    };
  }

  // SetListPinned pins or unpins a List in the signed-in Member's own sidebar. It
  // never affects anyone else's.
  rpc SetListPinned(SetListPinnedRequest) returns (SetListPinnedResponse) {
    option (google.api.http) = {
      put: "/api/v1/lists/{list_uid}/pinned"
      body: "*"
    };
  }

  // CreateItem appends an Item to a List.
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse) {
    option (google.api.http) = {
      post: "/api/v1/lists/{list_uid}/items"
      body: "*"
    };
  }

  // UpdateItem changes an Item's label, quantity or due date. An unset field is left
  // alone.
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse) {
    option (google.api.http) = {
      patch: "/api/v1/items/{item_uid}"
      body: "*"
    };
  }

  // SetItemDone ticks or unticks an Item. A tick is a tick whoever made it, so this
  // never conflicts.
  rpc SetItemDone(SetItemDoneRequest) returns (SetItemDoneResponse) {
    option (google.api.http) = {
      put: "/api/v1/items/{item_uid}/done"
      body: "*"
    };
  }

  // MoveItem places an Item after another one, or at the top when after_item_uid is
  // empty.
  rpc MoveItem(MoveItemRequest) returns (MoveItemResponse) {
    option (google.api.http) = {
      post: "/api/v1/items/{item_uid}:move"
      body: "*"
    };
  }

  // DeleteItem removes an Item.
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse) {
    option (google.api.http) = {delete: "/api/v1/items/{item_uid}"};
  }

  // ListDatedItems returns unticked Items with a due date, across every List the
  // Member can reach. Today, Upcoming and the calendar are all views over this: a
  // calendar is a lens on dates, not a second home for Lists.
  rpc ListDatedItems(ListDatedItemsRequest) returns (ListDatedItemsResponse) {
    option (google.api.http) = {get: "/api/v1/dated-items"};
  }

  // Search finds Lists and Items by what a Member wrote in them. It is what ⌘K reads.
  // Results narrow while they are still typing, and never include anything they could
  // not already open.
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {get: "/api/v1/search"};
  }
}

// Sharing is who can reach a List.
enum Sharing {
  SHARING_UNSPECIFIED = 0;
  // SHARING_PRIVATE is only the owner. Nobody else sees it in their sidebar.
  SHARING_PRIVATE = 1;
  // SHARING_INSTANCE is everyone here, including whoever joins later.
  SHARING_INSTANCE = 2;
  // SHARING_SPECIFIC is named Members and Groups.
  SHARING_SPECIFIC = 3;
}

// List is a named, ordered collection of Items.
message List {
  string uid = 1;
  string name = 2;
  Sharing sharing = 3;

  // False means whoever it is shared with may see and print it, but not tick or add.
  bool can_edit = 4;

  // Whether the signed-in Member owns it. Only an owner may rename, share, archive or
  // delete it.
  bool is_owner = 5;

  // Whether the signed-in Member has pinned it to their own sidebar.
  bool is_pinned = 6;

  // How many Items are not yet ticked. The number beside the name in the sidebar.
  int32 open_count = 7;

  // How many Items have been ticked. With open_count it says whether a List is
  // finished or simply empty: a List nobody has put anything on yet is neither.
  int32 done_count = 8;

  // When the List was made, RFC 3339.
  string created_at = 9;

  // When it, or anything on it, last changed. RFC 3339.
  string updated_at = 10;

  // When it was archived, RFC 3339, or empty while it is not. An archived List is out
  // of the sidebar and still searchable and restorable.
  string archived_at = 11;

  // Who archived it, by name, for a row that says so. Empty while it is not archived.
  string archived_by_name = 12;
}

// Item is one line on a List.
message Item {
  string uid = 1;
  string label = 2;

  // Free text — "2", "1 kg" — never a number.
  string quantity = 3;

  // A date, not a time: YYYY-MM-DD, or empty for an Item with no due date.
  string due_on = 4;

  bool done = 5;

  // Who put it on the List, shown at the right of the row.
  string added_by_name = 6;

  // Who ticked it, when anyone has.
  string done_by_name = 7;

  // When it was ticked, RFC 3339, or empty. A tick that has just landed is held for a
  // second before it settles, and this is how a reader knows it just landed.
  string done_at = 11;

  // Who ticked it, as an identifier. A reader compares it with their own, because a
  // tick of your own is not news.
  string done_by_uid = 12;

  // The Note attached to the Item, as markdown. Empty when there is none.
  string note = 8;

  // 9 and 10 held note_first_line and note_remaining_lines: the Note's first line and a
  // count of the rest, worked out by taking the markdown shorthand off the front of it.
  // That guesses, and guessed wrong — an empty checklist item reached a row as "[ ]".
  // A client has the Note itself and can read it with the same parser that renders it,
  // so there is nothing here worth deriving.
  //
  // Reserved rather than freed: a number reused for something else is read by an older
  // client as whatever used to be there.
  reserved 9, 10;
  reserved "note_first_line", "note_remaining_lines";

  // The Access token it came through, by name, or empty when a browser added it. The
  // Member in added_by_name is still the one who did it: a token is somebody's access
  // narrowed, never an identity of its own.
  string added_via_token = 13;
}

// Which Lists a page covers.
enum ListStatus {
  LIST_STATUS_UNSPECIFIED = 0;
  // Everything still in play: nothing archived, and nothing finished.
  LIST_STATUS_ACTIVE = 1;
  // Had Items and none are open. A List nobody has filled in is not finished.
  LIST_STATUS_COMPLETED = 2;
  // Put out of the sidebar. Out of the other three as well.
  LIST_STATUS_ARCHIVED = 3;
  // Deleted, and still inside the window where its owner can bring it back. Only its
  // owner sees these: whoever it was shared with lost it from their sidebar when it
  // went, and restoring it is not theirs to decide.
  LIST_STATUS_DELETED = 4;
}

// How a page of Lists is arranged.
enum ListOrder {
  LIST_ORDER_UNSPECIFIED = 0;
  LIST_ORDER_UPDATED = 1;
  LIST_ORDER_NAME = 2;
  LIST_ORDER_OPEN = 3;
}

message ListListsRequest {
  ListStatus status = 1;
  ListOrder order = 2;

  // 1-based. Zero reads as the first page.
  int32 page = 3;

  // How many rows a page holds. Zero takes the server's own, and anything above it is
  // clamped: the page size is the server's promise about how much work one read is.
  int32 page_size = 4;
}

message ListListsResponse {
  repeated List lists = 1;

  // How many matched, not how many are on this page.
  int32 total = 2;

  // Whether counting gave up: there are more than total, and total is where it
  // stopped. Reading a page costs the same however much there is; counting one does
  // not, so past a point the answer is "at least this many" rather than a number that
  // took a second to earn.
  bool at_least = 5;

  // Echoed back so a caller knows what it got, whatever it asked for.
  int32 page = 3;
  int32 page_size = 4;
}

message GetSidebarRequest {}

// One group of the sidebar: the rows it draws, and how many there are in total.
message SidebarGroup {
  repeated List lists = 1;
  int32 total = 2;

  // Whether counting gave up short of the truth — see ListListsResponse.at_least.
  bool at_least = 3;
}

message GetSidebarResponse {
  SidebarGroup pinned = 1;
  SidebarGroup mine = 2;
  SidebarGroup shared = 3;
  SidebarGroup completed = 4;
}

message GetListRequest {
  string list_uid = 1;
}

message GetListResponse {
  List list = 1;
  repeated Item items = 2;
}

message GetItemRequest {
  string item_uid = 1;
}

message GetItemResponse {
  Item item = 1;

  // The List it is on, so a caller holding only an item_uid knows where it came from
  // and what it may do with it.
  List list = 2;
}

message CreateListRequest {
  // At most 200 characters.
  string name = 1 [(buf.validate.field).string.max_len = 200];
}

message CreateListResponse {
  List list = 1;
}

message RenameListRequest {
  string list_uid = 1;
  // At most 200 characters.
  string name = 2 [(buf.validate.field).string.max_len = 200];
}

message RenameListResponse {
  List list = 1;
}

message SetListSharingRequest {
  string list_uid = 1;
  Sharing sharing = 2;
  bool can_edit = 3;

  // Who it reaches by name, for SHARING_SPECIFIC. Sharing is one decision, not a
  // sequence of additions: these replace whatever was there, and both are ignored for
  // any other kind of sharing.
  repeated string member_uids = 4;
  repeated string group_uids = 5;
}

message SetListSharingResponse {
  List list = 1;
}

message GetListSharesRequest {
  string list_uid = 1;
}

message GetListSharesResponse {
  repeated string member_uids = 1;
  repeated string group_uids = 2;
}

message DuplicateListRequest {
  string list_uid = 1;
}

message DuplicateListResponse {
  List list = 1;
}

message SetListArchivedRequest {
  string list_uid = 1;

  // True to put it away, false to bring it back.
  bool archived = 2;
}

message SetListArchivedResponse {
  List list = 1;
}

message RestoreListRequest {
  string list_uid = 1;
}

message RestoreListResponse {
  List list = 1;
}

message DeleteListRequest {
  string list_uid = 1;
}

message DeleteListResponse {}

message SetListPinnedRequest {
  string list_uid = 1;
  bool pinned = 2;
}

message SetListPinnedResponse {}

message CreateItemRequest {
  string list_uid = 1;
  // At most 500 characters.
  string label = 2 [(buf.validate.field).string.max_len = 500];
  // At most 50 characters.
  string quantity = 3 [(buf.validate.field).string.max_len = 50];
  string due_on = 4;
}

message CreateItemResponse {
  Item item = 1;
}

message UpdateItemRequest {
  string item_uid = 1;

  // Each field is optional: an unset one is left alone, so changing a quantity does not
  // have to restate the label.
  //
  // At most 500 characters.
  optional string label = 2 [(buf.validate.field).string.max_len = 500];
  // At most 50 characters.
  optional string quantity = 3 [(buf.validate.field).string.max_len = 50];
  optional string due_on = 4;

  // The Note, as markdown. Sending an empty string removes it.
  //
  // At most 64000 characters.
  optional string note = 5 [(buf.validate.field).string.max_len = 64000];

  // What the caller believed the text was when they started changing it.
  //
  // Set one of these and the change is refused when the stored text is something else,
  // with ABORTED. That is the whole of conflict detection in nooks, and it is only
  // offered for text: a tick says what an Item should be rather than what it was, so
  // there is nothing to compare and nothing to refuse.
  //
  // Leave them unset and the write is unconditional, which is what a script wants.
  optional string expected_label = 6;
  optional string expected_note = 7;
}

message UpdateItemResponse {
  Item item = 1;
}

message SetItemDoneRequest {
  string item_uid = 1;
  bool done = 2;
}

message SetItemDoneResponse {
  Item item = 1;
}

message MoveItemRequest {
  string item_uid = 1;

  // The Item to place it after. Empty puts it at the top.
  string after_item_uid = 2;
}

message MoveItemResponse {}

message DeleteItemRequest {
  string item_uid = 1;
}

message DeleteItemResponse {}

// SearchHitKind says what a hit is.
enum SearchHitKind {
  SEARCH_HIT_KIND_UNSPECIFIED = 0;
  SEARCH_HIT_KIND_LIST = 1;
  SEARCH_HIT_KIND_ITEM = 2;
  SEARCH_HIT_KIND_NOTE = 3;
}

// SearchHit is one match.
message SearchHit {
  SearchHitKind kind = 1;

  // What to open: the List itself, or the List the Item sits on.
  string list_uid = 2;

  // The Item, when the hit is one.
  string item_uid = 3;

  // The matched text, for showing the result.
  string text = 4;

  // The name of the List the hit belongs to, so a result reads in context.
  string list_name = 5;
}

message SearchRequest {
  // What the Member typed. The last word is treated as a prefix.
  string query = 1;
}

message SearchResponse {
  repeated SearchHit hits = 1;
}

// DatedItem is an Item with enough of its List to render a row away from it.
message DatedItem {
  Item item = 1;
  string list_uid = 2;
  string list_name = 3;
}

message ListDatedItemsRequest {
  // The earliest day to include, YYYY-MM-DD. Empty means no lower bound, which is how
  // Today gathers everything overdue as well as everything due.
  string from = 1;

  // The latest day to include, YYYY-MM-DD. Required.
  string to = 2;
}

message ListDatedItemsResponse {
  repeated DatedItem items = 1;
}
