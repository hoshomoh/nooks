syntax = "proto3";

package nooks.api.v1;

// AuthService covers getting into a Nooks Instance: first run, signing in, signing
// out, and replacing a temporary password.
//
// Nooks sends no email, so there is no emailed reset link here. A forgotten password
// becomes a Reset request an Admin approves in Activity.
service AuthService {
  // CompleteSetup creates the first Admin and names the Instance, in one step. It is
  // only available while the Instance has no Members; afterwards it fails.
  rpc CompleteSetup(CompleteSetupRequest) returns (CompleteSetupResponse);

  // SignIn exchanges an email and password for a session cookie.
  rpc SignIn(SignInRequest) returns (SignInResponse);

  // SignOut ends the current session. Signing out twice is not a failure.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);

  // GetCurrentMember returns whoever the session cookie belongs to.
  rpc GetCurrentMember(GetCurrentMemberRequest) returns (GetCurrentMemberResponse);

  // ReplacePassword sets a new password for the signed-in Member. A Member who was
  // given a temporary password must call this before they can use Nooks.
  rpc ReplacePassword(ReplacePasswordRequest) returns (ReplacePasswordResponse);

  // RequestJoin asks an Admin for an account. It is how a Visitor gets in when public
  // signup is off, which is the default.
  rpc RequestJoin(RequestJoinRequest) returns (RequestJoinResponse);

  // GetJoinRequest reports whether an Admin has decided yet. The Visitor's browser
  // remembers the request id and comes back to the same address.
  rpc GetJoinRequest(GetJoinRequestRequest) returns (GetJoinRequestResponse);

  // CompleteJoin turns an approved Join request into an account, once the Visitor
  // chooses a password.
  rpc CompleteJoin(CompleteJoinRequest) returns (CompleteJoinResponse);

  // RequestPasswordReset asks an Admin to unlock an account. Nooks sends no email, so
  // the Admin checks it is really them however they like, then approves.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);

  // GetResetRequest reports whether an Admin has approved a reset yet.
  rpc GetResetRequest(GetResetRequestRequest) returns (GetResetRequestResponse);

  // CompletePasswordReset sets a new password against an approved reset.
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (CompletePasswordResetResponse);
}

// RequestStatus is where a request has got to.
enum RequestStatus {
  REQUEST_STATUS_UNSPECIFIED = 0;
  REQUEST_STATUS_PENDING = 1;
  REQUEST_STATUS_APPROVED = 2;
  // REQUEST_STATUS_IGNORED is never reported to the sender: ignoring is silent.
  REQUEST_STATUS_IGNORED = 3;
}

// Role is what a Member may do on this Instance.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // ROLE_ADMIN can reach instance settings, approve requests, and manage Members and
  // Groups.
  ROLE_ADMIN = 1;
  ROLE_MEMBER = 2;
}

// Member is a person with an account on this Instance, as seen over the wire. It
// never carries a password or a hash.
message Member {
  // The public identifier used in resource names and URLs.
  string uid = 1;

  // How the Member appears on Items they add.
  string name = 2;

  // Used to sign in. Nooks never sends mail to it.
  string email = 3;

  Role role = 4;

  // True while an Admin-set temporary password has not been replaced. The app must
  // send the Member to replace it before anything else.
  bool must_change_password = 5;

  // When the account was created, RFC 3339.
  string created_at = 6;

  // When they last signed in, RFC 3339, or empty for somebody who never has. The
  // Members table greys the name of a Member who has not arrived yet — the account is
  // real, the person has simply not used it.
  string last_signed_in_at = 7;
}

message CompleteSetupRequest {
  string name = 1;
  string email = 2;
  string password = 3;

  // What this Instance should be called, e.g. "Brunnen Street". Shows in the sidebar
  // and on printed pages.
  string instance_name = 4;
}

message CompleteSetupResponse {
  Member member = 1;
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  Member member = 1;
}

message SignOutRequest {}

message SignOutResponse {}

message GetCurrentMemberRequest {}

message GetCurrentMemberResponse {
  Member member = 1;
}

message ReplacePasswordRequest {
  // The password being replaced. Required even for a temporary one, so that an
  // unattended browser cannot be used to take over the account.
  string current_password = 1;

  string new_password = 2;
}

message ReplacePasswordResponse {
  Member member = 1;
}

message RequestJoinRequest {
  string name = 1;
  string email = 2;

  // Anything the Visitor wants to add, e.g. "It's Til, from upstairs". Optional.
  string message = 3;
}

message RequestJoinResponse {
  // The identifier the Visitor's browser remembers so it can check back.
  string request_uid = 1;
}

message GetJoinRequestRequest {
  string request_uid = 1;
}

message GetJoinRequestResponse {
  RequestStatus status = 1;

  // Carried back so the Visitor does not retype them. Empty unless approved.
  string name = 2;
  string email = 3;
}

message CompleteJoinRequest {
  string request_uid = 1;
  string name = 2;
  string password = 3;
}

message CompleteJoinResponse {
  Member member = 1;
}

message RequestPasswordResetRequest {
  // An email or a name — whatever the Member remembers.
  string email_or_name = 1;
}

message RequestPasswordResetResponse {
  string request_uid = 1;
}

message GetResetRequestRequest {
  string request_uid = 1;
}

message GetResetRequestResponse {
  RequestStatus status = 1;
}

message CompletePasswordResetRequest {
  string request_uid = 1;
  string new_password = 2;
}

message CompletePasswordResetResponse {
  Member member = 1;
}
