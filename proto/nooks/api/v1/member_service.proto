syntax = "proto3";

package nooks.api.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "nooks/api/v1/auth_service.proto";

// MemberService covers who is here and how they are grouped.
//
// A Group carries no permissions of its own: it is a shortcut for sharing, so that
// "the flatmates" is one thing to pick rather than three.
service MemberService {
  // ListMembers returns everyone on the Instance, by name.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {get: "/api/v1/members"};
  }

  // ListGroups returns every Group, with who is in it.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (google.api.http) = {get: "/api/v1/groups"};
  }

  // CreateGroup adds a Group. Admins only.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/groups"
      body: "*"
    };
  }

  // SetGroupMembers replaces who is in a Group. Admins only.
  //
  // Removing someone takes away the Lists they reached through it, and nothing else.
  rpc SetGroupMembers(SetGroupMembersRequest) returns (SetGroupMembersResponse) {
    option (google.api.http) = {
      put: "/api/v1/groups/{group_uid}/members"
      body: "*"
    };
  }

  // AddMember creates an account with a temporary password, which is read out once.
  //
  // nooks has no mail server, so an Admin hands the password over in person or however
  // else they already talk. The Member must replace it before anything else.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse) {
    option (google.api.http) = {
      post: "/api/v1/members"
      body: "*"
    };
  }

  // SetMemberRole makes somebody an Admin, or stops them being one.
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse) {
    option (google.api.http) = {
      put: "/api/v1/members/{member_uid}/role"
      body: "*"
    };
  }

  // RemoveMember closes an account and deletes the Lists they started. What they added
  // to anybody else's Lists stays, with their name gone from it: a household's shopping
  // is not one person's to take away by leaving.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (google.api.http) = {delete: "/api/v1/members/{member_uid}"};
  }

  // UpdateOwnProfile changes the signed-in Member's own name and email.
  //
  // Their own, and only their own. An Admin who wants somebody else's name changed
  // asks them: an account is a person, and nooks does not let one person edit another.
  rpc UpdateOwnProfile(UpdateOwnProfileRequest) returns (UpdateOwnProfileResponse) {
    option (google.api.http) = {
      patch: "/api/v1/members/me"
      body: "*"
    };
  }
}

// Group is a named set of Members.
message Group {
  string uid = 1;
  string name = 2;

  // Who is in it, in the order they read: the dialog shows names, not counts.
  repeated Member members = 3;

  // The Lists this Group reaches, by name. A Group is only ever a shortcut for
  // sharing, so what it reaches is the whole of what it does.
  repeated string list_names = 4;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated Member members = 1;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message CreateGroupRequest {
  // At most 200 characters.
  string name = 1 [(buf.validate.field).string.max_len = 200];

  // Who is in it from the start. A Group is made in order to share with the people in
  // it, so naming it and filling it is one decision, not two.
  repeated string member_uids = 2;
}

message CreateGroupResponse {
  Group group = 1;
}

message SetGroupMembersRequest {
  string group_uid = 1;
  repeated string member_uids = 2;
}

message SetGroupMembersResponse {
  Group group = 1;
}

message AddMemberRequest {
  // At most 100 characters.
  string name = 1 [(buf.validate.field).string.max_len = 100];
  // At most 254 characters.
  string email = 2 [(buf.validate.field).string.max_len = 254];
}

message UpdateOwnProfileRequest {
  // At most 100 characters.
  string name = 1 [(buf.validate.field).string.max_len = 100];

  // Used to sign in, so it has to stay unique on the Instance. nooks never sends mail
  // to it, and changing it takes effect on the next sign-in like any other.
  //
  // At most 254 characters.
  string email = 2 [(buf.validate.field).string.max_len = 254];
}

message UpdateOwnProfileResponse {
  Member member = 1;
}

message AddMemberResponse {
  Member member = 1;

  // The temporary password, in clear, shown once and never again. nooks does not keep
  // it: what is stored is a hash, and this is the only time it can be read.
  string temporary_password = 2;
}

message SetMemberRoleRequest {
  string member_uid = 1;
  Role role = 2;
}

message SetMemberRoleResponse {
  Member member = 1;
}

message RemoveMemberRequest {
  string member_uid = 1;

  // Who the Lists they started are given to. Whoever removes somebody is the one who
  // knows which of the household actually uses the shopping list, so this is a choice
  // rather than always the Admin doing it.
  string give_lists_to_uid = 2;

  // Delete those Lists instead, with everything anybody has put on them.
  //
  // Exactly one of these two is required. Deleting is not what a caller gets by leaving
  // a field out: a request naming neither is refused, so the destructive answer is one
  // somebody gave rather than one they forgot to.
  bool delete_their_lists = 3;
}

message RemoveMemberResponse {}
