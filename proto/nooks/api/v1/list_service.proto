syntax = "proto3";

package nooks.api.v1;

import "google/api/annotations.proto";

// ListService covers Lists and the Items on them — the whole of Nooks, really.
// Everything else is a view over these.
service ListService {
  // ListLists returns every List the signed-in Member can reach, with the counts the
  // sidebar shows.
  rpc ListLists(ListListsRequest) returns (ListListsResponse) {
    option (google.api.http) = {get: "/api/v1/lists"};
  }

  // GetList returns one List and its Items, in their manual order.
  rpc GetList(GetListRequest) returns (GetListResponse) {
    option (google.api.http) = {get: "/api/v1/lists/{list_uid}"};
  }

  // CreateList adds a List. It starts private.
  rpc CreateList(CreateListRequest) returns (CreateListResponse) {
    option (google.api.http) = {
      post: "/api/v1/lists"
      body: "*"
    };
  }

  // RenameList changes a List's name. Only its owner may.
  rpc RenameList(RenameListRequest) returns (RenameListResponse) {
    option (google.api.http) = {
      patch: "/api/v1/lists/{list_uid}"
      body: "*"
    };
  }

  // SetListSharing changes who can reach a List. Only its owner may.
  rpc SetListSharing(SetListSharingRequest) returns (SetListSharingResponse) {
    option (google.api.http) = {
      put: "/api/v1/lists/{list_uid}/sharing"
      body: "*"
    };
  }

  // GetListShares returns who a List reaches by name, for the share dialog.
  rpc GetListShares(GetListSharesRequest) returns (GetListSharesResponse) {
    option (google.api.http) = {get: "/api/v1/lists/{list_uid}/shares"};
  }

  // DeleteList removes a List and the Items on it. Only its owner may.
  rpc DeleteList(DeleteListRequest) returns (DeleteListResponse) {
    option (google.api.http) = {delete: "/api/v1/lists/{list_uid}"};
  }

  // DuplicateList copies a List and the Items still open on it.
  //
  // The copy starts private and starts empty of history: it is a new List that happens
  // to begin with the same things on it, not a second view of the first.
  rpc DuplicateList(DuplicateListRequest) returns (DuplicateListResponse) {
    option (google.api.http) = {
      post: "/api/v1/lists/{list_uid}:duplicate"
      body: "*"
    };
  }

  // SetListPinned pins or unpins a List in the signed-in Member's own sidebar. It
  // never affects anyone else's.
  rpc SetListPinned(SetListPinnedRequest) returns (SetListPinnedResponse) {
    option (google.api.http) = {
      put: "/api/v1/lists/{list_uid}/pinned"
      body: "*"
    };
  }

  // CreateItem appends an Item to a List.
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse) {
    option (google.api.http) = {
      post: "/api/v1/lists/{list_uid}/items"
      body: "*"
    };
  }

  // UpdateItem changes an Item's label, quantity or due date. An unset field is left
  // alone.
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse) {
    option (google.api.http) = {
      patch: "/api/v1/items/{item_uid}"
      body: "*"
    };
  }

  // SetItemDone ticks or unticks an Item. A tick is a tick whoever made it, so this
  // never conflicts.
  rpc SetItemDone(SetItemDoneRequest) returns (SetItemDoneResponse) {
    option (google.api.http) = {
      put: "/api/v1/items/{item_uid}/done"
      body: "*"
    };
  }

  // MoveItem places an Item after another one, or at the top when after_item_uid is
  // empty.
  rpc MoveItem(MoveItemRequest) returns (MoveItemResponse) {
    option (google.api.http) = {
      post: "/api/v1/items/{item_uid}:move"
      body: "*"
    };
  }

  // DeleteItem removes an Item.
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse) {
    option (google.api.http) = {delete: "/api/v1/items/{item_uid}"};
  }

  // ListDatedItems returns unticked Items with a due date, across every List the
  // Member can reach. Today, Upcoming and the calendar are all views over this: a
  // calendar is a lens on dates, not a second home for Lists.
  rpc ListDatedItems(ListDatedItemsRequest) returns (ListDatedItemsResponse) {
    option (google.api.http) = {get: "/api/v1/dated-items"};
  }

  // Search finds Lists and Items by what a Member wrote in them. It is what ⌘K reads.
  // Results narrow while they are still typing, and never include anything they could
  // not already open.
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {get: "/api/v1/search"};
  }
}

// Sharing is who can reach a List.
enum Sharing {
  SHARING_UNSPECIFIED = 0;
  // SHARING_PRIVATE is only the owner. Nobody else sees it in their sidebar.
  SHARING_PRIVATE = 1;
  // SHARING_INSTANCE is everyone here, including whoever joins later.
  SHARING_INSTANCE = 2;
  // SHARING_SPECIFIC is named Members and Groups.
  SHARING_SPECIFIC = 3;
}

// List is a named, ordered collection of Items.
message List {
  string uid = 1;
  string name = 2;
  Sharing sharing = 3;

  // False means whoever it is shared with may see and print it, but not tick or add.
  bool can_edit = 4;

  // Whether the signed-in Member owns it. Only an owner may rename, share or delete.
  bool is_owner = 5;

  // Whether the signed-in Member has pinned it to their own sidebar.
  bool is_pinned = 6;

  // How many Items are not yet ticked. The number beside the name in the sidebar.
  int32 open_count = 7;
}

// Item is one line on a List.
message Item {
  string uid = 1;
  string label = 2;

  // Free text — "2", "1 kg" — never a number.
  string quantity = 3;

  // A date, not a time: YYYY-MM-DD, or empty for an Item with no due date.
  string due_on = 4;

  bool done = 5;

  // Who put it on the List, shown at the right of the row.
  string added_by_name = 6;

  // Who ticked it, when anyone has.
  string done_by_name = 7;

  // When it was ticked, RFC 3339, or empty. A tick that has just landed is held for a
  // second before it settles, and this is how a reader knows it just landed.
  string done_at = 11;

  // Who ticked it, as an identifier. A reader compares it with their own, because a
  // tick of your own is not news.
  string done_by_uid = 12;

  // The Note attached to the Item, as markdown. Empty when there is none.
  string note = 8;

  // The Note's own first line, for the row. Nooks never summarises a Member, so this
  // is what they wrote rather than anything generated.
  string note_first_line = 9;

  // How many further lines the Note has, for the "+N lines" after the first.
  int32 note_remaining_lines = 10;

  // The Access token it came through, by name, or empty when a browser added it. The
  // Member in added_by_name is still the one who did it: a token is somebody's access
  // narrowed, never an identity of its own.
  string added_via_token = 13;
}

message ListListsRequest {}

message ListListsResponse {
  repeated List lists = 1;
}

message GetListRequest {
  string list_uid = 1;
}

message GetListResponse {
  List list = 1;
  repeated Item items = 2;
}

message CreateListRequest {
  string name = 1;
}

message CreateListResponse {
  List list = 1;
}

message RenameListRequest {
  string list_uid = 1;
  string name = 2;
}

message RenameListResponse {
  List list = 1;
}

message SetListSharingRequest {
  string list_uid = 1;
  Sharing sharing = 2;
  bool can_edit = 3;

  // Who it reaches by name, for SHARING_SPECIFIC. Sharing is one decision, not a
  // sequence of additions: these replace whatever was there, and both are ignored for
  // any other kind of sharing.
  repeated string member_uids = 4;
  repeated string group_uids = 5;
}

message SetListSharingResponse {
  List list = 1;
}

message GetListSharesRequest {
  string list_uid = 1;
}

message GetListSharesResponse {
  repeated string member_uids = 1;
  repeated string group_uids = 2;
}

message DuplicateListRequest {
  string list_uid = 1;
}

message DuplicateListResponse {
  List list = 1;
}

message DeleteListRequest {
  string list_uid = 1;
}

message DeleteListResponse {}

message SetListPinnedRequest {
  string list_uid = 1;
  bool pinned = 2;
}

message SetListPinnedResponse {}

message CreateItemRequest {
  string list_uid = 1;
  string label = 2;
  string quantity = 3;
  string due_on = 4;
}

message CreateItemResponse {
  Item item = 1;
}

message UpdateItemRequest {
  string item_uid = 1;

  // Each field is optional: an unset one is left alone, so changing a quantity does not
  // have to restate the label.
  optional string label = 2;
  optional string quantity = 3;
  optional string due_on = 4;

  // The Note, as markdown. Sending an empty string removes it.
  optional string note = 5;
}

message UpdateItemResponse {
  Item item = 1;
}

message SetItemDoneRequest {
  string item_uid = 1;
  bool done = 2;
}

message SetItemDoneResponse {
  Item item = 1;
}

message MoveItemRequest {
  string item_uid = 1;

  // The Item to place it after. Empty puts it at the top.
  string after_item_uid = 2;
}

message MoveItemResponse {}

message DeleteItemRequest {
  string item_uid = 1;
}

message DeleteItemResponse {}

// SearchHitKind says what a hit is.
enum SearchHitKind {
  SEARCH_HIT_KIND_UNSPECIFIED = 0;
  SEARCH_HIT_KIND_LIST = 1;
  SEARCH_HIT_KIND_ITEM = 2;
  SEARCH_HIT_KIND_NOTE = 3;
}

// SearchHit is one match.
message SearchHit {
  SearchHitKind kind = 1;

  // What to open: the List itself, or the List the Item sits on.
  string list_uid = 2;

  // The Item, when the hit is one.
  string item_uid = 3;

  // The matched text, for showing the result.
  string text = 4;

  // The name of the List the hit belongs to, so a result reads in context.
  string list_name = 5;
}

message SearchRequest {
  // What the Member typed. The last word is treated as a prefix.
  string query = 1;
}

message SearchResponse {
  repeated SearchHit hits = 1;
}

// DatedItem is an Item with enough of its List to render a row away from it.
message DatedItem {
  Item item = 1;
  string list_uid = 2;
  string list_name = 3;
}

message ListDatedItemsRequest {
  // The earliest day to include, YYYY-MM-DD. Empty means no lower bound, which is how
  // Today gathers everything overdue as well as everything due.
  string from = 1;

  // The latest day to include, YYYY-MM-DD. Required.
  string to = 2;
}

message ListDatedItemsResponse {
  repeated DatedItem items = 1;
}
