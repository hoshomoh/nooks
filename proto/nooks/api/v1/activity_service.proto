syntax = "proto3";

package nooks.api.v1;

import "google/api/annotations.proto";

// ActivityService is everything waiting for one Member's attention.
//
// Nooks has no mail server, so this panel is the only place any of it surfaces. That is
// why an entry carries its own words rather than a code the reader has to interpret.
service ActivityService {
  // ListActivity returns what is waiting, newest first.
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse) {
    option (google.api.http) = {get: "/api/v1/activity"};
  }

  // MarkActivityRead marks everything the Member has now seen.
  rpc MarkActivityRead(MarkActivityReadRequest) returns (MarkActivityReadResponse) {
    option (google.api.http) = {
      post: "/api/v1/activity:markRead"
      body: "*"
    };
  }
}

// ActivityKind says what an entry is about.
enum ActivityKind {
  ACTIVITY_KIND_UNSPECIFIED = 0;
  // ACTIVITY_KIND_JOIN_REQUEST is somebody asking for an account.
  ACTIVITY_KIND_JOIN_REQUEST = 1;
  // ACTIVITY_KIND_RESET_REQUEST is a Member asking to replace a forgotten password.
  ACTIVITY_KIND_RESET_REQUEST = 2;
  // ACTIVITY_KIND_LIST_SHARED is a List somebody shared with you.
  ACTIVITY_KIND_LIST_SHARED = 3;
  // ACTIVITY_KIND_CONFLICT is two people having edited the same text.
  ACTIVITY_KIND_CONFLICT = 4;
  // ACTIVITY_KIND_TOKEN_USED is an access token reaching the Instance for the first
  // time, or one being stopped by somebody other than its owner.
  ACTIVITY_KIND_TOKEN_USED = 5;
}

// Activity is one thing waiting for attention.
message Activity {
  string uid = 1;
  ActivityKind kind = 2;

  // What it says, in words. Written when the entry is made, so the panel never has to
  // reconstruct what happened.
  string text = 3;

  // What it points at: a request, a List, or nothing.
  string target_uid = 4;

  // When it happened, RFC 3339.
  string created_at = 5;

  bool unread = 6;

  // What became of a request, once an Admin decided. Unspecified until one has.
  ActivityOutcome outcome = 7;
}

// ActivityOutcome is what an Admin decided about a request.
enum ActivityOutcome {
  ACTIVITY_OUTCOME_UNSPECIFIED = 0;
  ACTIVITY_OUTCOME_APPROVED = 1;
  // The sender is never told, which is the whole point of ignoring.
  ACTIVITY_OUTCOME_IGNORED = 2;
}

message ListActivityRequest {}

message ListActivityResponse {
  repeated Activity activity = 1;

  // How many are still unread — the dot on the Activity control.
  int32 unread_count = 2;
}

message MarkActivityReadRequest {}

message MarkActivityReadResponse {}
