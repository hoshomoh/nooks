name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      # The store suite runs against both drivers. Without this the Postgres cases
      # skip, and the driver would rot unnoticed.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nooks
          POSTGRES_PASSWORD: nooks
          POSTGRES_DB: nooks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
        env:
          NOOKS_TEST_POSTGRES_DSN: postgres://nooks:nooks@localhost:5432/nooks?sslmode=disable
      - name: Formatted
        run: test -z "$(gofmt -l cmd internal server store)"

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      # The whole history, because buf breaking compares against main. A shallow
      # checkout has no main to compare with and the check would quietly skip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm proto:lint
      - name: Formatted
        working-directory: proto
        run: test -z "$(pnpm exec buf format -d)"
      # The protos are the contract every client is built against. A change that would
      # break one stops here rather than in somebody's build.
      - name: No breaking changes
        working-directory: proto
        run: pnpm exec buf breaking --against "../.git#branch=origin/main,subdir=proto"

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm --filter @nooks/web lint
      - name: Test
        run: pnpm --filter @nooks/web test
      # One build, not two: `release` is the same Vite build with its output pointed at
      # the binary, so building both proved the same thing twice.
      #
      # The release output path is relative to apps/web, so a directory move can
      # silently start writing the bundle somewhere the binary does not embed.
      - name: Build, landing where go:embed reads
        run: |
          pnpm --filter @nooks/web release
          test -d server/router/frontend/dist/assets
          test ! -e apps/server

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The reference pages and the MDX index are both generated by the build, from the
      # protos and from content/docs. Neither is committed, so a build that needs one of
      # them to already exist is a build that only works on the machine it was written on.
      - name: Build
        run: pnpm --filter @nooks/website build
      # The API reference is generated from proto/gen/openapi.yaml. If the spec stops
      # producing pages — a plugin change, an annotation dropped — the build still
      # succeeds and the docs quietly lose their reference. This is the check that the
      # site actually has one.
      - name: The reference has pages
        run: test "$(find apps/website/content/docs/api -name '*.mdx' | wc -l)" -gt 20

      # A build that succeeds while the navigation is broken is a build that cannot be
      # trusted. This caught nothing when it was written because it was written after
      # the header spent a release pointing at a folder rather than a page.
      - name: Every internal link reaches a page
        run: pnpm --filter @nooks/website check-links
      # Somebody reviewing a change to the docs or the landing page can read the built
      # site rather than the diff.
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: apps/website/.next
          retention-days: 7
