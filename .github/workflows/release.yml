# What happens when a version is tagged.
#
# Binaries for the four machines people actually self-host on, and a multi-architecture
# image. Both carry the version and the commit they were built from, so an instance can
# say what it is running and a bug report can name a build.
#
#   git tag -a v1.0.0 -m "..." && git push origin v1.0.0
#
# Nothing here runs on a branch. A release is a tag, and a tag is the only thing that
# should be able to publish one.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: pnpm install --frozen-lockfile

      # Once, not once per architecture. The app is the same bytes on every one of
      # them, and it is baked into each binary by go:embed.
      - name: Build the app
        run: pnpm --filter @nooks/web release

      - name: Build the binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          # The machines people self-host on: a VPS or a NAS, and a Mac to try it on.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="nooks-${VERSION}-${os}-${arch}"
            echo "building ${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w \
                -X github.com/hoshomoh/nooks/internal/version.Version=${VERSION#v} \
                -X github.com/hoshomoh/nooks/internal/version.Commit=${COMMIT::7}" \
              -o "out/${name}" ./cmd/nooks
            ( cd out && tar -czf "${name}.tar.gz" "${name}" && rm "${name}" )
          done

      # So somebody downloading over a connection they do not control can tell whether
      # they got what was published.
      - name: Checksums
        run: cd out && sha256sum *.tar.gz > SHA256SUMS

      # A build that cannot say what it is is a build nobody can file a bug against.
      - name: The binary knows its own version
        run: |
          set -euo pipefail
          tar -xzf "out/nooks-${{ github.ref_name }}-linux-amd64.tar.gz" -C out
          reported="$(./out/nooks-${{ github.ref_name }}-linux-amd64 --version)"
          echo "reports: ${reported}"
          case "$reported" in
            "${GITHUB_REF_NAME#v}"*) ;;
            *) echo "reported ${reported}, expected ${GITHUB_REF_NAME#v}" >&2; exit 1 ;;
          esac
          rm "out/nooks-${{ github.ref_name }}-linux-amd64"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3, 1.2, and latest. Somebody pinning a major gets patches; somebody pinning
      # the full version gets exactly what they pinned.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
