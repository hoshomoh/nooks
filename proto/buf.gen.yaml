version: v2
managed:
  enabled: true
  # googleapis keeps its real Go package. Without this, managed mode rewrites it to a
  # path under this module that nothing generates, and the build stops on a missing
  # import of our own making.
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    # protovalidate for the same reason: its Go types are published, and rewriting the
    # package to a path under this module leaves the generated code importing something
    # nothing generates.
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/hoshomoh/nooks/proto/gen
# Every plugin is pinned. Unpinned, a run takes whatever is newest, and connect-go 2
# writes code for a connect the module does not use. connect-go stays on 1 with go.mod,
# and es moves with the @bufbuild/protobuf runtime.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: gen
    opt: paths=source_relative
  # The gateway calls a gRPC-shaped server interface, which this generates. nooks does
  # not serve gRPC — the stubs exist so the gateway has something to talk to in-process.
  - remote: buf.build/grpc/go:v1.6.2
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.33.0
    out: gen
    opt: paths=source_relative
  # The OpenAPI spec, which the docs site and the MCP tools both read. Generated, so it
  # cannot describe an API that no longer exists.
  - remote: buf.build/community/google-gnostic-openapi:v0.7.1
    out: gen
    opt:
      # Named here because several services contribute paths, so the generator has no
      # single service to take a title from and leaves it empty.
      # The option parser splits on punctuation, so a sentence here becomes a flag it
      # does not recognise. The description belongs on the docs page instead.
      - title=nooks
      - version=v1
      - enum_type=string
  - remote: buf.build/bufbuild/es:v2.17.0
    out: ../packages/api/src/gen
    opt: target=ts
    include_imports: true
