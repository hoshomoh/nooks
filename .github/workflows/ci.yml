name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      # The store suite runs against both drivers. Without this the Postgres cases
      # skip, and the driver would rot unnoticed.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nooks
          POSTGRES_PASSWORD: nooks
          POSTGRES_DB: nooks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
        env:
          NOOKS_TEST_POSTGRES_DSN: postgres://nooks:nooks@localhost:5432/nooks?sslmode=disable
      - name: Formatted
        run: test -z "$(gofmt -l cmd internal server store)"

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm proto:lint
      - name: Formatted
        working-directory: proto
        run: test -z "$(pnpm exec buf format -d)"

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm --filter @nooks/web lint
      - name: Test
        run: pnpm --filter @nooks/web test
      - name: Build
        run: pnpm --filter @nooks/web build
      # The release output path is relative to apps/web, so a directory move can
      # silently start writing the bundle somewhere the binary does not embed.
      - name: Release lands where go:embed reads
        run: |
          pnpm --filter @nooks/web release
          test -d server/router/frontend/dist/assets
          test ! -e apps/server
