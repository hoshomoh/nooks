syntax = "proto3";

package nooks.api.v1;

import "google/api/annotations.proto";

// InstanceService reports what this copy of Nooks is and how it is configured.
service InstanceService {
  // GetInstance returns the public profile of this Instance. It is reachable without
  // authentication because the sign-in page and the Public list both need it before
  // anyone has signed in.
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse) {
    option (google.api.http) = {get: "/api/v1/instance"};
  }

  // GetInstanceSettings returns everything an Admin may change, including which List
  // is public. Admins only: which List is published is not a fact a Visitor gets to
  // read from the outside.
  rpc GetInstanceSettings(GetInstanceSettingsRequest) returns (GetInstanceSettingsResponse) {
    option (google.api.http) = {get: "/api/v1/instance/settings"};
  }

  // UpdateInstanceSettings replaces them. Admins only.
  rpc UpdateInstanceSettings(UpdateInstanceSettingsRequest) returns (UpdateInstanceSettingsResponse) {
    option (google.api.http) = {
      put: "/api/v1/instance/settings"
      body: "*"
    };
  }

  // GetInstanceAbout reports what this copy of Nooks is and how much it holds. Any
  // Member: it is their Instance too, and none of it is anybody else's business.
  rpc GetInstanceAbout(GetInstanceAboutRequest) returns (GetInstanceAboutResponse) {
    option (google.api.http) = {get: "/api/v1/instance/about"};
  }

  // DeleteInstance empties it and returns it to first run. Admins only, and there is
  // no undo: Nooks keeps no backup of its own.
  rpc DeleteInstance(DeleteInstanceRequest) returns (DeleteInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/instance:delete"
      body: "*"
    };
  }
}

message DeleteInstanceRequest {
  // The Admin's own password. An unattended browser is the realistic way this happens
  // by accident, and a name can be read off the screen in front of you.
  string password = 1;

  // The Instance's name, typed out, so that whoever is doing this has read what they
  // are about to lose.
  string instance_name = 2;
}

message DeleteInstanceResponse {}

message GetInstanceAboutRequest {}

message GetInstanceAboutResponse {
  // The build that is running, e.g. "1.0.2".
  string version = 1;

  // When first run finished, RFC 3339. How long the Instance has been going.
  string started_at = 2;

  int32 member_count = 3;
  int32 list_count = 4;
  int32 item_count = 5;

  // How much room the database is taking, or zero where the driver cannot say. Zero
  // renders as nothing: a wrong number about somebody's disk is worse than no number.
  int64 storage_bytes = 6;

  // The licence this build is under, e.g. "AGPL-3.0".
  string licence = 7;

  // What is holding the data, e.g. "sqlite". Shown beside the size.
  string storage_driver = 8;

  // What the Instance calls itself, so About can be read without a second request.
  string instance_name = 9;
}

// PublicListSettings is the Instance's one public page, and what a Visitor sees of it.
message PublicListSettings {
  // The List on the page, or empty for no public page at all.
  string list_uid = 1;

  // Contributor names on the rows. Off by default: a public page is about what needs
  // buying, not about who is in the household.
  bool show_names = 2;

  // Quantities and dates on the rows — the metadata a shopper actually needs.
  bool show_meta = 3;

  // A quiet link at the foot of the page for a Visitor to ask for an account.
  bool allow_join = 4;
}

message InstanceSettings {
  // What the Instance calls itself, e.g. "Brunnen Street".
  string name = 1;

  // When false, every account starts as a join request an Admin approves.
  bool public_signup = 2;

  PublicListSettings public_list = 3;

  // The language of anything nobody chose a language for: the public page, a printed
  // sheet, and a Member who has not picked one. Empty means English.
  string default_locale = 4;
}

message GetInstanceSettingsRequest {}

message GetInstanceSettingsResponse {
  InstanceSettings settings = 1;
}

message UpdateInstanceSettingsRequest {
  InstanceSettings settings = 1;
}

message UpdateInstanceSettingsResponse {
  InstanceSettings settings = 1;
}

message GetInstanceRequest {}

message GetInstanceResponse {
  // The mutable display label chosen at first run, e.g. "Brunnen Street". Empty
  // until first run completes.
  string name = 1;

  // The build of Nooks that is running, e.g. "1.0.2".
  string version = 2;

  // True until the first Admin exists. The app shows first run rather than sign in.
  bool needs_setup = 3;

  // When false, every account starts as a join request an Admin approves.
  bool public_signup = 4;

  // The language a Visitor reads this Instance in. Reachable without authentication
  // because the public page needs it before anybody has signed in.
  string default_locale = 5;
}
