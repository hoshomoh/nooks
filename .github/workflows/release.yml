# What happens when a release lands on main.
#
# Nobody tags by hand. release-please reads the Conventional Commits since the last
# release, keeps a pull request open with the version and the changelog it would write,
# and cuts the tag when somebody merges it. Releasing is then a review of what is about
# to be published rather than a command somebody has to remember the shape of.
#
# The binaries and the image are built from that tag, in this file rather than in one
# triggered by it: a tag pushed with GITHUB_TOKEN does not start a workflow, so a build
# listening for `push: tags` would never run and the release would arrive empty.
name: Release

on:
  push:
    branches: [main]

# Read-only by default, and each job widens it to what that job does. The actions below
# are pinned to major tags, so they are whatever that tag points at on the day — and the
# way that has gone wrong elsewhere is a tag moved to point at something else. What a
# compromised action could reach is then bounded by the job it runs in rather than by
# the most a release needs anywhere.
permissions:
  contents: read

jobs:
  please:
    name: Release PR
    runs-on: ubuntu-latest
    # Writes the tag and the release, and keeps the release pull request up to date.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # Only true on the push that merged the release pull request.
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: Binaries
    needs: please
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Attaches files to the release that already exists. It writes nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.please.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: pnpm install --frozen-lockfile

      # Once, not once per architecture. The app is the same bytes on every one of
      # them, and it is baked into each binary by go:embed.
      - name: Build the app
        run: pnpm --filter @nooks/web release

      - name: Build the binaries
        env:
          VERSION: ${{ needs.please.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          # The machines people self-host on: a VPS or a NAS, and a Mac to try it on.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="nooks-${VERSION}-${os}-${arch}"
            echo "building ${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w \
                -X github.com/hoshomoh/nooks/internal/version.Version=${VERSION#v} \
                -X github.com/hoshomoh/nooks/internal/version.Commit=${COMMIT::7}" \
              -o "out/${name}" ./cmd/nooks
            ( cd out && tar -czf "${name}.tar.gz" "${name}" && rm "${name}" )
          done

      # So somebody downloading over a connection they do not control can tell whether
      # they got what was published.
      - name: Checksums
        run: cd out && sha256sum *.tar.gz > SHA256SUMS

      # A build that cannot say what it is is a build nobody can file a bug against.
      - name: The binary knows its own version
        env:
          TAG: ${{ needs.please.outputs.tag }}
        run: |
          set -euo pipefail
          tar -xzf "out/nooks-${TAG}-linux-amd64.tar.gz" -C out
          reported="$(./out/nooks-${TAG}-linux-amd64 --version)"
          echo "reports: ${reported}"
          case "$reported" in
            "${TAG#v}"*) ;;
            *) echo "reported ${reported}, expected ${TAG#v}" >&2; exit 1 ;;
          esac
          rm "out/nooks-${TAG}-linux-amd64"

      # Uploaded to the release release-please has already written, rather than
      # published as a new one: the notes on it are the changelog, and a second
      # publish would replace them with a generated list of commits.
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.please.outputs.tag }}" out/* --clobber

  image:
    name: Image
    needs: please
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Reads the tag it was told to build, and pushes to the registry. It does not write
    # to the repository at all.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.please.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3, 1.2, and latest. Somebody pinning a major gets patches; somebody pinning
      # the full version gets exactly what they pinned.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.please.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.please.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
