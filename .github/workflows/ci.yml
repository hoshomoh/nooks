name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      # The store suite runs against both drivers. Without this the Postgres cases
      # skip, and the driver would rot unnoticed.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nook
          POSTGRES_PASSWORD: nook
          POSTGRES_DB: nook
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
        env:
          NOOK_TEST_POSTGRES_DSN: postgres://nook:nook@localhost:5432/nook?sslmode=disable
      - name: Formatted
        run: test -z "$(gofmt -l cmd internal server store)"

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm proto:lint
      - name: Formatted
        working-directory: proto
        run: test -z "$(pnpm exec buf format -d)"

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm --filter @nook/web lint
      - name: Build
        run: pnpm --filter @nook/web build
