packages:
  - apps/*
  - packages/*

# @bufbuild/buf ships its platform binary as an optional dependency, so its build
# script has nothing to do. Denied explicitly rather than left unreviewed, which
# pnpm treats as an error.
allowBuilds:
  '@bufbuild/buf': false

minimumReleaseAgeExclude:
  - '@rolldown/binding-openharmony-arm64@1.2.8'
  - '@next/env@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - next@16.3.5
